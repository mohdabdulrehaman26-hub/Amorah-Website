<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Coaching | Amorah Group</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    
    <script src="links/external-links.js" defer></script>
    <script src="links/links-init.js" defer></script>
    <script src="js/main.js" defer></script>
</head>

<body class="bg-slate-50 text-gray-900 antialiased font-sans">

    <div id="header"></div>

    <section class="pt-32 pb-12 bg-slate-900 text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-slate-900/90 z-0"></div>
        <img src="https://images.unsplash.com/photo-1434030216411-0b793f4b4173?q=80&w=2070&auto=format&fit=crop" 
             class="absolute inset-0 w-full h-full object-cover opacity-20 z-[-1]" alt="Background">
        
        <div class="relative z-10 container mx-auto px-6">
            <h1 class="text-3xl md:text-4xl font-bold text-white font-heading">Start Your Preparation</h1>
            <p class="text-slate-300 mt-2 max-w-xl mx-auto">Fill in your details below to register for our expert coaching sessions.</p>
        </div>
    </section>

    <section class="py-16">
        <div class="container mx-auto px-6">
            <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100">
                <div class="bg-gradient-to-r from-blue-600 to-cyan-500 h-2 w-full"></div> 
                
                <div class="p-8 md:p-12">
                    <form id="coachingForm" class="space-y-6">
                        
                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Full Name <span class="text-red-500">*</span></label>
                            <input type="text" name="entry.1481150044" required placeholder="Enter your full name" 
                                   class="w-full p-4 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>

                        <div class="grid md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Mobile Number <span class="text-red-500">*</span></label>
                                <input type="tel" name="entry.1082152387" required placeholder="+91 XXXXX XXXXX" 
                                       class="w-full p-4 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2">Email Address <span class="text-red-500">*</span></label>
                                <input type="email" name="entry.180960900" required placeholder="john@example.com" 
                                       class="w-full p-4 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Select Course <span class="text-red-500">*</span></label>
                            <select id="courseSelect" name="entry.1469651108" required 
                                    class="w-full p-4 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition cursor-pointer bg-white">
                                <option value="" disabled selected>-- Select Course --</option>
                                <option value="IELTS">IELTS</option>
                                <option value="PTE">PTE (Pearson)</option>
                                <option value="TOEFL">TOEFL</option>
                                <option value="Duolingo">Duolingo</option>
                                <option value="German">German Language</option>
                                <option value="French">French Language</option>
                                <option value="OET">OET (Medical)</option>
                                <option value="Spoken English">Spoken English</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-slate-700 mb-2">Current Location <span class="text-red-500">*</span></label>
                            <input type="text" name="entry.1900380200" required placeholder="City, State (e.g. Hyderabad)" 
                                   class="w-full p-4 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
                        </div>

                        <input type="text" name="bot_check" style="display:none !important;" autocomplete="off">

                        <button type="submit" class="btn-premium w-full text-lg py-4 mt-4 shadow-lg hover:shadow-xl">
                            Submit Application <i class="fas fa-paper-plane ml-2"></i>
                        </button>

                        <p id="formMsg" class="hidden text-center mt-4 text-sm font-bold p-3 rounded-lg border"></p>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>

    <a data-link="whatsapp_chat" href="#" class="wa-float" target="_blank" aria-label="Chat on WhatsApp">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Auto-select course from URL params
            const urlParams = new URLSearchParams(window.location.search);
            const course = urlParams.get('course');
            if (course) {
                const select = document.getElementById('courseSelect');
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].value === course) {
                        select.selectedIndex = i;
                        break;
                    }
                }
            }

            // 2. Specific Form Submission Logic
            document.getElementById('coachingForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                const form = this;
                const btn = form.querySelector('button[type="submit"]');
                const msg = document.getElementById('formMsg');
                const originalText = btn.innerHTML;

                // Disable button
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting...';

                // THE COACHING FORM URL
                const COACHING_SHEET_URL = "https://docs.google.com/forms/d/e/1FAIpQLSfi7WtJPDe3aMmXxc7PMOJHzTv8t2x-EyfcUx_nfUq8JSzMLg/formResponse";

                try {
                    await fetch(COACHING_SHEET_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        body: new FormData(form)
                    });

                    // Track Conversion (Specific for Coaching)
                    if(typeof fbq !== 'undefined') fbq('track', 'SubmitApplication');

                    // Success Message
                    msg.classList.remove('hidden');
                    msg.className = "text-center mt-4 text-sm font-bold text-green-600 bg-green-50 p-3 rounded-lg border border-green-200";
                    msg.textContent = "Application Submitted Successfully! We will contact you soon.";
                    form.reset();

                } catch (error) {
                    // Error Message
                    msg.classList.remove('hidden');
                    msg.className = "text-center mt-4 text-sm font-bold text-red-600 bg-red-50 p-3 rounded-lg border border-red-200";
                    msg.textContent = "Something went wrong. Please check your connection.";
                } finally {
                    // Reset Button after 3 seconds
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.innerHTML = originalText;
                    }, 3000);
                }
            });
        });
    </script>

</body>
</html>
